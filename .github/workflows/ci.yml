name: FlowTeam CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: flowteam
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: flowteam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flowteam"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STORAGE_BACKEND: database
      DATABASE_URL: postgresql://flowteam:ci-only-password@127.0.0.1:5432/flowteam
      BETTER_AUTH_SECRET: ci-only-secret-for-isolated-ephemeral-tests-at-least-32-chars
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node -e "require('fs').writeFileSync('.env', '')"
      - run: npx prisma generate
      - run: npm run db:migrate
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Integration and browser tests against production build
        run: |
          npm run start > /tmp/flowteam-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then break; fi
            sleep 1
          done
          npm run test:integration
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
            docs/screenshots/
